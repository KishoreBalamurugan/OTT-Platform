<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - My OTT Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center h-screen">

<div class="bg-gray-800 p-8 rounded-xl shadow-2xl w-96 border border-gray-700">
    <h1 class="text-3xl font-bold mb-6 text-center text-red-500">🎬 Login</h1>

    <form id="login-form" class="space-y-4">
        <div>
            <label class="block text-sm text-gray-400 mb-1">Email</label>
            <input type="email" id="email" required
                   class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-red-500"
                   placeholder="kishore@gmail.com">
        </div>
        <div>
            <label class="block text-sm text-gray-400 mb-1">Password</label>
            <input type="password" id="password" required
                   class="w-full bg-gray-700 border border-gray-600 rounded px-3 py-2 text-white focus:outline-none focus:border-red-500"
                   placeholder="••••••••">
        </div>
        <button type="submit"
                class="w-full bg-red-600 text-white py-2 rounded font-medium hover:bg-red-700 transition">
            Login
        </button>
    </form>

    <div id="error-msg" class="text-red-400 text-sm text-center mt-4"></div>

    <p class="text-gray-400 text-sm text-center mt-6">
        Don't have an account?
        <a href="/register.html" class="text-red-400 hover:underline">
            Register here
        </a>
    </p>
</div>

<script>
    document.getElementById('login-form').addEventListener('submit', function(event) {
        event.preventDefault(); // Stop page from reloading

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        // Call your teammate's login backend API
        fetch('/api/auth/login', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ email, password })
        })
            .then(response => {
                if (!response.ok) {
                    throw new Error('Invalid email or password');
                }
                // Read the response stream once as text safely
                return response.text();
            })
            .then(text => {
                let token = text;
                try {
                    // If the response is JSON, extract the token property
                    const data = JSON.parse(text);
                    token = data.token || data.accessToken || text;
                } catch (e) {
                    // If it's not JSON, the raw text itself is the token
                }

                if (token) {
                    // Save token into browser storage
                    localStorage.setItem('token', token);

                    // Redirect to your home page
                    window.location.href = '/index.html';
                } else {
                    throw new Error('Token not received from server');
                }
            })
            .catch(error => {
                document.getElementById('error-msg').innerText = error.message;
            });
    });
</script>
</body>
</html>
