<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My OTT Platform</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen">

<nav class="bg-gray-800 border-b border-gray-700 px-6 py-4 flex justify-between items-center shadow-md">
    <h2 class="text-xl font-bold text-red-500">My OTT Platform</h2>
    <div class="space-x-4 flex items-center">
        <a href="/index.html" class="text-gray-300 hover:text-white font-medium">Home</a>
        <a href="/profile.html" class="bg-gray-700 px-3 py-1.5 rounded text-sm font-medium hover:bg-gray-600 transition">My Profile</a>
        <a href="/watchlist.html" class="bg-gray-700 px-3 py-1.5 rounded text-sm font-medium hover:bg-gray-600 transition">Watchlist</a>
        <a href="/subscription.html" class="bg-red-600 px-3 py-1.5 rounded text-sm font-medium hover:bg-red-700 transition">Subscriptions</a>
        <button onclick="logout()" class="text-sm text-gray-400 hover:text-red-400">Logout</button>
    </div>
</nav>

<div class="p-6 max-w-5xl mx-auto">
    <h1 class="text-2xl font-bold mb-4">Catalog</h1>

    <div class="my-4">
        <input type="text" id="searchBox" placeholder="Search movies or series"
               class="bg-gray-800 border border-gray-700 px-4 py-2 rounded w-full md:w-96 text-white focus:outline-none focus:border-red-500">
    </div>

    <div class="space-x-2 my-4">
        <button id="allBtn" onclick="loadMovies('')" class="filter-btn bg-red-600 border border-red-500 px-4 py-2 rounded transition">All</button>
        <button id="movieBtn" onclick="loadMovies('Movie')" class="filter-btn bg-gray-800 border border-gray-700 px-4 py-2 rounded hover:bg-gray-700 transition">Movies</button>
        <button id="seriesBtn" onclick="loadMovies('Series')" class="filter-btn bg-gray-800 border border-gray-700 px-4 py-2 rounded hover:bg-gray-700 transition">Series</button>
    </div>
    <div id="movieList" class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-6"></div>
</div>

<script src="script.js"></script>
<script>
    function logout() {
        localStorage.removeItem('token');
        window.location.href = '/login.html';
    }
</script>
</body>
</html>
