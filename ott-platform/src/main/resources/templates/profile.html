<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Profile - OTT Platform</title>
    <style>
        body { background-color: #141414; color: white; font-family: Arial, sans-serif; text-align: center; padding-top: 50px; }
        .profile-card { background: #222; max-width: 400px; margin: auto; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #E50914; }
        p { font-size: 1.1rem; color: #aaa; margin: 15px 0; }
        .btn { display: inline-block; background: #E50914; color: white; padding: 10px 20px; text-decoration: none; border-radius: 4px; margin-top: 20px; font-weight: bold; }
        .btn:hover { background: #f40612; }
    </style>
</head>
<body>
<div class="profile-card">
    <h1>User Profile 👤</h1>
    <p><strong>Username:</strong> <span th:text="${username}">User</span></p>
    <p><strong>Email:</strong> <span th:text="${email}">email@example.com</span></p>
    <p><strong>Current Plan:</strong> <span th:text="${plan}">Standard</span></p>
    <a href="/subscription" class="btn">View Available Plans</a>
</div>
</body>
</html>
